<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Built Weblabb | Design Portfolio</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      padding: 50px 20px 30px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    header p {
      color: #aaa;
      font-size: 18px;
    }

    .portfolio {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 30px;
      max-width: 1100px;
      margin: auto;
    }

    .portfolio img {
      width: 100%;
      border-radius: 12px;
      display: block;
    }

    .contact {
      padding: 40px 20px;
    }

    .contact a {
      display: inline-block;
      padding: 15px 25px;
      background: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
    }

    footer {
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>BUILT WEBLABB</h1>
    <p>Graphic Design & Creative Portfolio</p>
    <p>Custom flyers • Promotional designs • Branding</p>
  </header>

  <section class="portfolio">

    <img src="IMG_2920.jpeg" alt="Graphic Design Flyer">

  </section>

  <section class="contact">
    <h2>Need a Design?</h2>
    <p>Let's create something for your brand.</p>

    <a href="https://wa.me/233559299402" target="_blank">
      Contact Me on WhatsApp
    </a>
  </section>

  <footer>
    © 2026 Built Weblabb — Graphic Design Portfolio
  </footer>

</body>
</html>
